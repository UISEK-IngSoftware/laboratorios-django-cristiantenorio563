<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ pokemon.nombre }}</title>

    <style>

        body{
            background: linear-gradient(to right, #000000, #530505);
            font-family: Arial;
            color: white;
            margin: 0;
            padding: 0;
        }

        .contenedor{
            width: 500px;
            margin: 50px auto;
            background: white;
            color: black;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.4);
        }

        img{
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .info{
            padding: 20px;
        }

        h1{
            margin-top: 0;
            color: #640303;
        }

        p{
            font-size: 18px;
        }

        .btn{
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background: #640303;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>
<body>

    <div class="contenedor">

        <img src="{{ pokemon.imagen }}" alt="{{ pokemon.nombre }}">

        <div class="info">

            <h1>{{ pokemon.nombre }}</h1>

            <p><strong>Tipo:</strong> {{ pokemon.tipo }}</p>

            <p><strong>Peso:</strong> {{ pokemon.peso }} kg</p>

            <p><strong>Altura:</strong> {{ pokemon.altura }} m</p>

            <p><strong>Entrenador:</strong> {{ pokemon.entrenador.nombre }} {{ pokemon.entrenador.apellido }}</p>

            <p><strong>Ciudad:</strong> {{ pokemon.entrenador.ciudad }}</p>

            {% if pokemon.video %}

            <h2>Video</h2>
            
            <iframe
                width="100%"
                height="315"
                src="{{ pokemon.video }}"
                frameborder="0"
                allowfullscreen>
            </iframe>

            {% endif %}

            <a href="/" class="btn">
                Volver
            </a>

        </div>

    </div>

</body>
</html>
