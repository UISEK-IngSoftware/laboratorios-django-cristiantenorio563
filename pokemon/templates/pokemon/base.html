<!DOCTYPE html>
<html>

<head>

    <title>

        {% block title %}
        Pokedex
        {% endblock %}

    </title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <ul class="navbar-nav me-auto">

            <li class="nav-item">

                <a
                    href="{% url 'pokedex:lista_pokemon' %}"
                    class="nav-link"
                >
                    Pokemons
                </a>

            </li>


            {% if user.is_authenticated %}

                <li class="nav-item">

                    <span class="nav-link">

                        Hola {{ user.username }}

                    </span>

                </li>


                <li class="nav-item">

                    <form
                    action="{% url 'pokedex:logout' %}"
                    method="post">

                        {% csrf_token %}

                        <button
                        type="submit"
                        class="btn btn-link nav-link text-white"
                        style="text-decoration:none;">

                            Cerrar Sesion

                        </button>

                    </form>

                </li>

            {% else %}

                <li class="nav-item">

                    <a
                        href="{% url 'pokedex:login' %}"
                        class="nav-link"
                    >
                        Iniciar Sesion
                    </a>

                </li>

            {% endif %}

        </ul>

    </div>

</nav>


<div>

{% block content %}

{% endblock %}

</div>

</body>

</html>
